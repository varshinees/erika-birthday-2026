<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rory's Kidnapping</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #faf5ff; color: #333; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; padding: 40px 15px; box-sizing: border-box;">
    
    <div id="mainContainer" style="background: #ffffff; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(147, 51, 234, 0.1); width: 100%; max-width: 450px; box-sizing: border-box;">
        <h2 style="text-align: center; color: #6b21a8; margin-top: 0; margin-bottom: 5px;">Rory's Kidnapping</h2>
        <p style="text-align: center; color: #6b7280; font-size: 13px; margin-top: 0; margin-bottom: 25px; font-style: italic;">All passwords are in lowercase!</p>
        
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <!-- Input 1 -->
            <form class="passphraseForm" data-index="1" style="background: #fcf8ff; padding: 15px; border-radius: 8px; border: 1px solid #e9d5ff; box-sizing: border-box;">
                <label for="passphrase1" style="font-weight: 600; font-size: 14px; color: #581c87; display: block; margin-bottom: 8px;">Puzzle 1: A Bookish Encounter</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="passphrase1" name="passphrase" placeholder="Enter passphrase..." required autocapitalize="none" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #d8b4fe; border-radius: 6px; outline: none; font-size: 14px; box-sizing: border-box;">
                    <button type="submit" style="background-color: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;">Submit</button>
                </div>
            </form>

            <!-- Input 2 -->
            <form class="passphraseForm" data-index="2" style="background: #fcf8ff; padding: 15px; border-radius: 8px; border: 1px solid #e9d5ff; box-sizing: border-box;">
                <label for="passphrase2" style="font-weight: 600; font-size: 14px; color: #581c87; display: block; margin-bottom: 8px;">Puzzle 2: Piano Chess</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="passphrase2" name="passphrase" placeholder="Enter passphrase..." required autocapitalize="none" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #d8b4fe; border-radius: 6px; outline: none; font-size: 14px; box-sizing: border-box;">
                    <button type="submit" style="background-color: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;">Submit</button>
                </div>
            </form>

            <!-- Input 3 -->
            <form class="passphraseForm" data-index="3" style="background: #fcf8ff; padding: 15px; border-radius: 8px; border: 1px solid #e9d5ff; box-sizing: border-box;">
                <label for="passphrase3" style="font-weight: 600; font-size: 14px; color: #581c87; display: block; margin-bottom: 8px;">Puzzle 3: Pokemon Crossing</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="passphrase3" name="passphrase" placeholder="Enter passphrase..." required autocapitalize="none" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #d8b4fe; border-radius: 6px; outline: none; font-size: 14px; box-sizing: border-box;">
                    <button type="submit" style="background-color: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;">Submit</button>
                </div>
            </form>

            <!-- Input 4 -->
            <form class="passphraseForm" data-index="4" style="background: #fcf8ff; padding: 15px; border-radius: 8px; border: 1px solid #e9d5ff; box-sizing: border-box;">
                <label for="passphrase4" style="font-weight: 600; font-size: 14px; color: #581c87; display: block; margin-bottom: 8px;">Puzzle 4: Italian Guessr</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="passphrase4" name="passphrase" placeholder="Enter passphrase..." required autocapitalize="none" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #d8b4fe; border-radius: 6px; outline: none; font-size: 14px; box-sizing: border-box;">
                    <button type="submit" style="background-color: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;">Submit</button>
                </div>
            </form>

            <!-- Input 5 -->
            <form class="passphraseForm" data-index="5" style="background: #fcf8ff; padding: 15px; border-radius: 8px; border: 1px solid #e9d5ff; box-sizing: border-box;">
                <label for="passphrase5" style="font-weight: 600; font-size: 14px; color: #581c87; display: block; margin-bottom: 8px;">Puzzle 5: Football</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="passphrase5" name="passphrase" placeholder="Enter passphrase..." required autocapitalize="none" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #d8b4fe; border-radius: 6px; outline: none; font-size: 14px; box-sizing: border-box;">
                    <button type="submit" style="background-color: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;">Submit</button>
                </div>
            </form>

            <!-- Input 6 -->
            <form class="passphraseForm" data-index="6" style="background: #fcf8ff; padding: 15px; border-radius: 8px; border: 1px solid #e9d5ff; box-sizing: border-box;">
                <label for="passphrase6" style="font-weight: 600; font-size: 14px; color: #581c87; display: block; margin-bottom: 8px;">Puzzle 6: Speed Scrabble</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="passphrase6" name="passphrase" placeholder="Enter passphrase..." required autocapitalize="none" autocomplete="off" spellcheck="false" style="flex: 1; min-width: 0; padding: 8px 12px; border: 1px solid #d8b4fe; border-radius: 6px; outline: none; font-size: 14px; box-sizing: border-box;">
                    <button type="submit" style="background-color: #9333ea; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; white-space: nowrap;">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Save the initial HTML layout of the body so we can restore it later
        const initialBodyHTML = document.body.innerHTML;

        // Mapping table matching each input form to its correct password, text, and link
        const passphraseMapping = {
            '1': {
                correctPassword: 'password1',
                text: 'You\'ve solved my puzzle! Head to SE 917 for the next one.',
                linkUrl: 'https://youtu.be/3pir4W-kadE'
            },
            '2': {
                correctPassword: 'password2',
                text: 'This is the description for the second resource.',
                linkUrl: 'https://example.com/resource2'
            },
            '3': {
                correctPassword: 'password3',
                text: 'This is the description for the third resource.',
                linkUrl: 'https://example.com/resource3'
            },
            '4': {
                correctPassword: 'password4',
                text: 'This is the description for the fourth resource.',
                linkUrl: 'https://example.com/resource4'
            },
            '5': {
                correctPassword: 'password5',
                text: 'This is the description for the fifth resource.',
                linkUrl: 'https://example.com/resource5'
            },
            '6': {
                correctPassword: 'password6',
                text: 'This is the description for the sixth resource.',
                linkUrl: 'https://example.com/resource6'
            }
        };

        // Function to re-bind event listeners after restoring the form
        function setupEventListeners() {
            document.querySelectorAll('.passphraseForm').forEach(form => {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();

                    const formIndex = this.getAttribute('data-index');
                    const inputField = this.querySelector('input[name="passphrase"]');
                    const enteredPassword = inputField.value;
                    const resourceData = passphraseMapping[formIndex];

                    // Check if the typed password matches the correct one for this specific field
                    if (enteredPassword === resourceData.correctPassword) {
                        // Clear the screen, display the text, the raw URL link, and a Back button inside a nice card container
                        document.body.innerHTML = `
                            <div style="background: #ffffff; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(147, 51, 234, 0.1); width: 100%; max-width: 450px; text-align: center; box-sizing: border-box; margin-top: 50px;">
                                <h2 style="color: #6b21a8; margin-top: 0;">Access Granted</h2>
                                <p style="color: #4b5563; font-size: 15px; line-height: 1.5; margin: 20px 0;">${resourceData.text}</p>
                                <p style="margin: 20px 0;"><a href="${resourceData.linkUrl}" target="_blank" style="color: #9333ea; font-weight: 600; text-decoration: none; word-break: break-all;">${resourceData.linkUrl}</a></p>
                                <br>
                                <button id="backButton" style="background-color: #9333ea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">← Back to Passphrases</button>
                            </div>
                        `;

                        // Add event listener to the back button to restore the original UI
                        document.getElementById('backButton').addEventListener('click', function() {
                            document.body.innerHTML = initialBodyHTML;
                            setupEventListeners(); // Re-apply event listeners to the restored forms
                        });
                    } else {
                        alert('Incorrect passphrase for this field. Please try again.');
                    }
                });
            });
        }

        // Initial setup call
        setupEventListeners();
    </script>
</body>
</html>
